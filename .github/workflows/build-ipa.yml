name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          WORK_DIR="$RUNNER_TEMP/ios-src"
          OUT_DIR="$RUNNER_TEMP/ipa-output"
          rm -rf "$WORK_DIR" "$OUT_DIR"
          mkdir -p "$WORK_DIR" "$OUT_DIR"

          SRC_ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$SRC_ZIP" ]; then
            echo "No source .zip archive found in repository root"
            exit 1
          fi
          echo "Extracting source archive: $SRC_ZIP"
          unzip -q "$SRC_ZIP" -d "$WORK_DIR"

          XCODEPROJ=$(find "$WORK_DIR" -maxdepth 4 -name "*.xcodeproj" | head -n 1 || true)
          if [ -z "$XCODEPROJ" ]; then
            echo "Could not locate any .xcodeproj inside $SRC_ZIP"
            find "$WORK_DIR" -maxdepth 4
            exit 1
          fi
          PROJECT_DIR=$(dirname "$XCODEPROJ")
          PROJECT_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Resolved XCODEPROJ: $XCODEPROJ"
          echo "Resolved PROJECT_DIR: $PROJECT_DIR"

          # Clean any stale build artifacts inside the archive
          rm -rf "$PROJECT_DIR/build"

          echo "SRC_ZIP=$SRC_ZIP" >> "$GITHUB_ENV"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Select Xcode toolchain
        run: |
          DEV_DIR=""
          for candidate in /Applications/Xcode_26.3.app/Contents/Developer /Applications/Xcode_26.2.app/Contents/Developer /Applications/Xcode_16.4.app/Contents/Developer /Applications/Xcode.app/Contents/Developer; do
            if [ -x "$candidate/usr/bin/xcodebuild" ]; then
              DEV_DIR="$candidate"
              break
            fi
          done
          if [ -z "$DEV_DIR" ]; then
            echo "No suitable Xcode Developer directory found"
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$DEV_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS app (Release-iphoneos)
        run: |
          cd "$PROJECT_DIR"
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED_DATA"

          if [ -f "Makefile" ] && grep -q "^build:" Makefile; then
            if command -v rustup >/dev/null 2>&1; then
              rustup target add aarch64-apple-ios || true
            fi
            make build
            APP_PATH=$(find "$PROJECT_DIR/build" -maxdepth 6 -name "*.app" -type d | head -n 1 || true)
          else
            # Detect first scheme if shared schemes exist, otherwise build all/first target
            SCHEME=$(xcodebuild -project "$XCODEPROJ" -list -json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("project",{}).get("schemes",[]); print(s[0] if s else "")' || true)
            if [ -n "$SCHEME" ]; then
              echo "Building scheme: $SCHEME"
              xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME" -configuration Release \
                -sdk iphoneos -destination 'generic/platform=iOS' \
                -derivedDataPath "$DERIVED_DATA" \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
                build
            else
              TARGET=$(xcodebuild -project "$XCODEPROJ" -list -json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); t=d.get("project",{}).get("targets",[]); print(t[0] if t else "")' || true)
              echo "Building target: ${TARGET:-ALL}"
              if [ -n "$TARGET" ]; then
                xcodebuild -project "$XCODEPROJ" -target "$TARGET" -configuration Release \
                  -sdk iphoneos -destination 'generic/platform=iOS' \
                  -derivedDataPath "$DERIVED_DATA" \
                  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
                  build
              else
                xcodebuild -project "$XCODEPROJ" -alltargets -configuration Release \
                  -sdk iphoneos -destination 'generic/platform=iOS' \
                  -derivedDataPath "$DERIVED_DATA" \
                  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
                  build
              fi
            fi
            APP_PATH=$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 2 -name "*.app" -type d | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Built .app bundle not found!"
            exit 1
          fi
          echo "Built APP_PATH: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          ls -la "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          STAGE_DIR="$RUNNER_TEMP/unsigned-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/"
          BASE_NAME=$(echo "$PROJECT_NAME" | tr ' ' '-')
          echo "BASE_NAME=$BASE_NAME" >> "$GITHUB_ENV"
          (
            cd "$STAGE_DIR"
            /usr/bin/zip -qr "$OUT_DIR/${BASE_NAME}-unsigned.ipa" Payload
          )
          (
            cd "$OUT_DIR"
            shasum -a 256 "${BASE_NAME}-unsigned.ipa" > "${BASE_NAME}-unsigned.ipa.sha256"
          )

      - name: Sign IPA with provided Apple Distribution certificate
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          KEYCHAIN_PATH="$SIGN_DIR/build-ipa.keychain-db"
          KEYCHAIN_PASS="temp-build-keychain-pass"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          python3 - "$SIGN_DIR/cert.p12" "$SIGN_DIR/cert.mobileprovision" <<'PYEOF'
          import base64, os, sys
          with open(sys.argv[1], "wb") as f:
              f.write(base64.b64decode(os.environ["IOS_P12_BASE64"]))
          with open(sys.argv[2], "wb") as f:
              f.write(base64.b64decode(os.environ["IOS_MOBILEPROVISION_BASE64"]))
          PYEOF

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$SIGN_DIR/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          IDENTITY_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/1\)/{print $2; exit}')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "No valid codesigning identity found in cert.p12"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Using signing identity: $IDENTITY_HASH"

          security cms -D -i "$SIGN_DIR/cert.mobileprovision" > "$SIGN_DIR/profile.plist"

          python3 - "$SIGN_DIR/profile.plist" "$SIGN_DIR/entitlements.plist" "$SIGN_DIR/bundle_id.txt" <<'PYEOF'
          import plistlib, sys
          profile_path, ent_out, bundle_out = sys.argv[1:4]
          with open(profile_path, "rb") as f:
              prof = plistlib.load(f)
          ent = prof.get("Entitlements", {})
          team_id = (prof.get("TeamIdentifier") or [""])[0]
          app_id = ent.get("application-identifier", "")
          prefix = f"{team_id}."
          bundle_id = app_id[len(prefix):] if app_id.startswith(prefix) else app_id

          out_ent = {
              "application-identifier": app_id,
              "com.apple.developer.team-identifier": team_id,
              "get-task-allow": bool(ent.get("get-task-allow", False)),
          }
          if "keychain-access-groups" in ent:
              out_ent["keychain-access-groups"] = ent["keychain-access-groups"]

          with open(ent_out, "wb") as f:
              plistlib.dump(out_ent, f)
          with open(bundle_out, "w") as f:
              f.write(bundle_id)
          print("Resolved bundle_id:", bundle_id)
          print("Resolved entitlements:", out_ent)
          PYEOF

          BUNDLE_ID=$(cat "$SIGN_DIR/bundle_id.txt")
          APP_BASENAME=$(basename "$APP_PATH")
          PAYLOAD_DIR="$SIGN_DIR/Payload"
          APP_DST="$PAYLOAD_DIR/$APP_BASENAME"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$APP_DST"

          if [ -d "$APP_DST/PlugIns" ]; then
            rm -rf "$APP_DST/PlugIns"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_DST/Info.plist"
          cp "$SIGN_DIR/cert.mobileprovision" "$APP_DST/embedded.mobileprovision"

          if [ -d "$APP_DST/Frameworks" ]; then
            find "$APP_DST/Frameworks" -maxdepth 2 \( -name "*.dylib" -o -name "*.framework" \) -exec \
              /usr/bin/codesign --force --sign "$IDENTITY_HASH" --timestamp=none {} \;
          fi

          /usr/bin/codesign --force --sign "$IDENTITY_HASH" \
            --entitlements "$SIGN_DIR/entitlements.plist" \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP_DST"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_DST"
          /usr/bin/codesign -d --entitlements :- "$APP_DST"

          (
            cd "$SIGN_DIR"
            /usr/bin/zip -qr "$OUT_DIR/${BASE_NAME}-signed.ipa" Payload
          )
          (
            cd "$OUT_DIR"
            shasum -a 256 "${BASE_NAME}-signed.ipa" > "${BASE_NAME}-signed.ipa.sha256"
          )
          ls -lh "$OUT_DIR"

      - name: Cleanup temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/build-ipa.keychain-db" 2>/dev/null || true

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa-output/*
          if-no-files-found: error

      - name: Publish GitHub Release with built IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT_DIR"/* --clobber
          else
            gh release create "$TAG" "$OUT_DIR"/* \
              --title "$PROJECT_NAME (Build ${{ github.run_number }})" \
              --notes "Built from \`$SRC_ZIP\` on macOS/Xcode. Includes signed IPA (\`${BASE_NAME}-signed.ipa\`) and unsigned IPA (\`${BASE_NAME}-unsigned.ipa\`)."
          fi
