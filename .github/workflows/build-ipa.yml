name: Build iOS IPA (SimpleTunnel)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Custom Bundle Identifier (match your certificate)'
        required: true
        default: 'app.garlic2817.jaguar9702'
      remove_plugins:
        description: 'Remove PlugIns/Extensions (prevent install failure on single-app certs)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write
  actions: read

jobs:
  build-ipa:
    name: Build & Package SimpleTunnel IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Build Environment & Xcode
        run: |
          echo "=== System Information ==="
          sw_vers
          xcodebuild -version
          swift --version

      - name: 3. Unpack Project Archive
        run: |
          echo "=== Locating Project Files ==="
          if [ -f "SimpleTunnel-master.zip" ]; then
            echo "Unzipping SimpleTunnel-master.zip..."
            unzip -q -o SimpleTunnel-master.zip
          fi
          
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "❌ Error: Could not find .xcodeproj file!"
            ls -la
            exit 1
          fi
          
          echo "✅ Found project at: $PROJ_PATH"
          echo "PROJ_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV
          echo "PROJ_FILE=$(basename "$PROJ_PATH")" >> $GITHUB_ENV

      - name: 4. Inspect Xcode Targets & Schemes
        run: |
          cd "$PROJ_DIR"
          echo "=== Xcode Schemes ==="
          xcodebuild -list -project "$PROJ_FILE"

      - name: 5. Compile iOS Target (SimpleTunnel)
        run: |
          cd "$PROJ_DIR"
          
          TARGET_BUNDLE_ID="${{ github.event.inputs.bundle_id || 'app.garlic2817.jaguar9702' }}"
          echo "=== Building SimpleTunnel iOS App with Bundle ID: $TARGET_BUNDLE_ID ==="
          
          xcodebuild build \
            -project "$PROJ_FILE" \
            -scheme SimpleTunnel \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$TARGET_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 6. Package App into IPA (Payload format)
        run: |
          cd "$PROJ_DIR"
          PAYLOAD_DIR="$(pwd)/Payload"
          EXPORT_DIR="$(pwd)/ipa_export"
          mkdir -p "$PAYLOAD_DIR" "$EXPORT_DIR"
          
          # Locate .app bundle
          APP_PATH=$(find build -name "SimpleTunnel.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: No .app bundle found in build folder!"
            find build -maxdepth 5
            exit 1
          fi
          
          echo "✅ Found compiled app bundle at: $APP_PATH"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          
          TARGET_APP="$PAYLOAD_DIR/SimpleTunnel.app"
          
          # Check remove_plugins option
          REMOVE_PLUGINS="${{ github.event.inputs.remove_plugins || 'true' }}"
          if [ "$REMOVE_PLUGINS" = "true" ]; then
            echo "Removing PlugIns directory to ensure compatibility with single-app certificate..."
            rm -rf "$TARGET_APP/PlugIns"
          fi
          
          # Ensure Info.plist has the matching Bundle ID
          TARGET_BUNDLE_ID="${{ github.event.inputs.bundle_id || 'app.garlic2817.jaguar9702' }}"
          echo "Updating CFBundleIdentifier in Info.plist to: $TARGET_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $TARGET_BUNDLE_ID" "$TARGET_APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $TARGET_BUNDLE_ID" "$TARGET_APP/Info.plist" || true
          
          # Compress to IPA
          zip -q -r -y "$EXPORT_DIR/SimpleTunnel.ipa" Payload
          
          echo "=== IPA Generated Successfully ==="
          ls -lh "$EXPORT_DIR/SimpleTunnel.ipa"
          echo "EXPORT_IPA_PATH=$EXPORT_DIR/SimpleTunnel.ipa" >> $GITHUB_ENV

      - name: 7. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTunnel-iOS-IPA
          path: ${{ env.PROJ_DIR }}/ipa_export/SimpleTunnel.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 8. Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.1.${{ github.run_number }}"
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "$EXPORT_IPA_PATH" \
            --title "SimpleTunnel iOS IPA (Build #${{ github.run_number }} - Certificate Ready)" \
            --notes "Pre-configured IPA with Bundle ID app.garlic2817.jaguar9702 and cleaned PlugIns for seamless ESign/SideStore/AltStore installation." || \
          gh release upload "$TAG_NAME" "$EXPORT_IPA_PATH" --clobber || true
