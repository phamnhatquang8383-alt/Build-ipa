name: Build iOS IPA with NetworkExtension (SimpleTunnel)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write
  actions: read

jobs:
  build-ipa:
    name: Build SimpleTunnel with NetworkExtension
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Build Environment
        run: |
          echo "=== System Information ==="
          sw_vers
          xcodebuild -version
          swift --version

      - name: 3. Unpack Project Archive
        run: |
          echo "=== Locating Project Files ==="
          if [ -f "SimpleTunnel-master.zip" ]; then
            echo "Unzipping SimpleTunnel-master.zip..."
            unzip -q -o SimpleTunnel-master.zip
          fi
          
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "❌ Error: Could not find .xcodeproj file!"
            exit 1
          fi
          
          echo "✅ Found project at: $PROJ_PATH"
          echo "PROJ_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV
          echo "PROJ_FILE=$(basename "$PROJ_PATH")" >> $GITHUB_ENV

      - name: 4. Compile SimpleTunnel & NetworkExtension
        run: |
          cd "$PROJ_DIR"
          
          echo "=== Compiling SimpleTunnel with NetworkExtension targets ==="
          xcodebuild build \
            -project "$PROJ_FILE" \
            -scheme SimpleTunnel \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="5T3A5P662G" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 5. Package IPAs (Full NetworkExtension & Clean Standalone)
        run: |
          cd "$PROJ_DIR"
          EXPORT_DIR="$(pwd)/ipa_export"
          mkdir -p "$EXPORT_DIR"
          
          APP_PATH=$(find build -name "SimpleTunnel.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: No .app bundle found!"
            exit 1
          fi
          
          echo "✅ Found compiled app bundle: $APP_PATH"
          
          # 1. Package FULL version with NetworkExtension (PacketTunnel.appex)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -q -r -y "$EXPORT_DIR/SimpleTunnel-With-NetworkExtension.ipa" Payload
          echo "Packaged: SimpleTunnel-With-NetworkExtension.ipa ($(ls -lh "$EXPORT_DIR/SimpleTunnel-With-NetworkExtension.ipa" | awk '{print $5}'))"
          
          # 2. Package STANDALONE version (without PlugIns)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/SimpleTunnel.app/PlugIns
          zip -q -r -y "$EXPORT_DIR/SimpleTunnel-Standalone.ipa" Payload
          echo "Packaged: SimpleTunnel-Standalone.ipa ($(ls -lh "$EXPORT_DIR/SimpleTunnel-Standalone.ipa" | awk '{print $5}'))"

      - name: 6. Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTunnel-iOS-IPAs
          path: ${{ env.PROJ_DIR }}/ipa_export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 7. Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$PROJ_DIR"
          TAG_NAME="v2.0.${{ github.run_number }}"
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" ipa_export/*.ipa \
            --title "SimpleTunnel iOS (Build #${{ github.run_number }} - NetworkExtension Enabled)" \
            --notes "Includes both SimpleTunnel-With-NetworkExtension.ipa (with PacketTunnel VPN Extension) and SimpleTunnel-Standalone.ipa. Entitlements and App Group configured for cert 5T3A5P662G (app.garlic2817.jaguar9702)." || true
