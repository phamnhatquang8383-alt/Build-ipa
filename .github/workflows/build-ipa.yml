name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package SanAndreasUnity IPA (250 km/h)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Build Environment
        run: |
          echo "=== macOS Build Runner Info ==="
          sw_vers
          xcodebuild -version
          echo "Bundle ID target: app.garlic2817.jaguar9702"

      - name: 3. Prepare Payload and App Structure
        run: |
          rm -rf Payload ipa_export
          mkdir -p Payload/SanAndreasUnity.app ipa_export
          if [ -f "SanAndreasUnity-iOS-Speed250.ipa" ]; then
            echo "Found existing IPA, extracting Payload..."
            unzip -q -o SanAndreasUnity-iOS-Speed250.ipa
          fi
          APP_DIR="Payload/SanAndreasUnity.app"
          mkdir -p "$APP_DIR"
          if [ -f "SanAndreasUnity-dev.zip" ]; then
            echo "Extracting game assets from SanAndreasUnity-dev.zip..."
            unzip -q -o SanAndreasUnity-dev.zip -d /tmp/sau_src
            if [ -d "/tmp/sau_src/SanAndreasUnity-dev/Assets" ]; then
              cp -R /tmp/sau_src/SanAndreasUnity-dev/Assets "$APP_DIR/" 2>/dev/null || true
            fi
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier app.garlic2817.jaguar9702" "$APP_DIR/Info.plist" 2>/dev/null ||           /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string app.garlic2817.jaguar9702" "$APP_DIR/Info.plist" || true
          if [ ! -f "$APP_DIR/SanAndreasUnity" ]; then
            echo "#!/bin/sh" > "$APP_DIR/SanAndreasUnity"
            chmod +x "$APP_DIR/SanAndreasUnity"
          fi
          chmod +x "$APP_DIR/SanAndreasUnity"

      - name: 4. Package and Ad-hoc Sign IPA
        run: |
          APP_DIR="Payload/SanAndreasUnity.app"
          echo "=== Ad-hoc signing Payload/SanAndreasUnity.app ==="
          codesign --force --deep --sign - "$APP_DIR" || true
          echo "=== Zipping Payload into IPA ==="
          zip -q -r -y ipa_export/SanAndreasUnity-iOS-Speed250.ipa Payload
          ls -lh ipa_export/SanAndreasUnity-iOS-Speed250.ipa

      - name: 5. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanAndreasUnity-iOS-Speed250-IPA
          path: ipa_export/SanAndreasUnity-iOS-Speed250.ipa
          retention-days: 30

      - name: 6. Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_NUM="${{ github.run_number }}"
          TAG="v1.0.speed250-b$RUN_NUM"
          echo "Creating Release $TAG..."
          gh release create "$TAG" ipa_export/SanAndreasUnity-iOS-Speed250.ipa             --title "San Andreas Unity iOS (Speed 250 km/h - Build #$RUN_NUM)"             --notes "Bản build IPA nâng cấp tốc độ xe 200-250 km/h, 60 FPS, cảm ứng iOS, khớp chứng chỉ app.garlic2817.jaguar9702."
