name: Build PhamQuangIOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PhamQuang-IOS-source.zip
        run: |
          WORK_DIR="$RUNNER_TEMP/phamquang-src"
          OUT_DIR="$RUNNER_TEMP/ipa-output"
          rm -rf "$WORK_DIR" "$OUT_DIR"
          mkdir -p "$WORK_DIR" "$OUT_DIR"
          unzip -q PhamQuang-IOS-source.zip -d "$WORK_DIR"
          PROJECT_DIR=$(find "$WORK_DIR" -maxdepth 3 -name "PhamQuangIOS.xcodeproj" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate PhamQuangIOS.xcodeproj inside PhamQuang-IOS-source.zip"
            exit 1
          fi
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Select Xcode 26+ and check toolchain
        run: |
          cd "$PROJECT_DIR"
          DEV_DIR=$(./scripts/select-xcode.sh || true)
          if [ -z "$DEV_DIR" ]; then
            for candidate in /Applications/Xcode_26*.app/Contents/Developer /Applications/Xcode.app/Contents/Developer; do
              if [ -x "$candidate/usr/bin/xcodebuild" ]; then
                DEV_DIR="$candidate"
                break
              fi
            done
          fi
          if [ -z "$DEV_DIR" ]; then
            echo "No suitable Xcode Developer directory found"
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$DEV_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          cmake --version

      - name: Build native Rust libraries and iOS app (Release)
        run: |
          cd "$PROJECT_DIR"
          make build

      - name: Package unsigned IPA
        run: |
          cd "$PROJECT_DIR"
          APP_PATH="$PROJECT_DIR/build/DerivedData/Build/Products/Release-iphoneos/PhamQuangIOS.app"
          test -d "$APP_PATH"
          python3 scripts/package_ipa.py \
            --app "$APP_PATH" \
            --output "$OUT_DIR/PhamQuangIOS-unsigned.ipa" \
            --expected-bundle-id sato.cc365.file \
            --expected-display-name "PhamQuang IOS" \
            --expected-version 1.4.1 \
            --expected-build 8 \
            --expected-tunnel-bundle-id sato.cc365.file.tunnel

      - name: Sign IPA with provided Apple Distribution certificate
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          KEYCHAIN_PATH="$SIGN_DIR/build-ipa.keychain-db"
          KEYCHAIN_PASS="temp-build-keychain-pass"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          echo "$IOS_P12_BASE64" | base64 --decode > "$SIGN_DIR/cert.p12"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$SIGN_DIR/cert.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$SIGN_DIR/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          IDENTITY_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/1\)/{print $2; exit}')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "No valid codesigning identity found in cert.p12"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Using signing identity: $IDENTITY_HASH"

          security cms -D -i "$SIGN_DIR/cert.mobileprovision" > "$SIGN_DIR/profile.plist"

          python3 - "$SIGN_DIR/profile.plist" "$SIGN_DIR/entitlements.plist" "$SIGN_DIR/bundle_id.txt" <<'PYEOF'
          import plistlib, sys
          profile_path, ent_out, bundle_out = sys.argv[1:4]
          with open(profile_path, "rb") as f:
              prof = plistlib.load(f)
          ent = prof.get("Entitlements", {})
          team_id = (prof.get("TeamIdentifier") or [""])[0]
          app_id = ent.get("application-identifier", "")
          prefix = f"{team_id}."
          bundle_id = app_id[len(prefix):] if app_id.startswith(prefix) else app_id

          out_ent = {
              "application-identifier": app_id,
              "com.apple.developer.team-identifier": team_id,
              "get-task-allow": bool(ent.get("get-task-allow", False)),
          }
          if "keychain-access-groups" in ent:
              out_ent["keychain-access-groups"] = ent["keychain-access-groups"]
          if "com.apple.developer.networking.networkextension" in ent:
              ne = ent["com.apple.developer.networking.networkextension"]
              out_ent["com.apple.developer.networking.networkextension"] = (
                  ["packet-tunnel-provider"] if "packet-tunnel-provider" in ne else ne
              )
          if "com.apple.developer.networking.vpn.api" in ent:
              out_ent["com.apple.developer.networking.vpn.api"] = ent["com.apple.developer.networking.vpn.api"]

          with open(ent_out, "wb") as f:
              plistlib.dump(out_ent, f)
          with open(bundle_out, "w") as f:
              f.write(bundle_id)
          print("Resolved bundle_id:", bundle_id)
          print("Resolved entitlements:", out_ent)
          PYEOF

          BUNDLE_ID=$(cat "$SIGN_DIR/bundle_id.txt")
          APP_SRC="$PROJECT_DIR/build/DerivedData/Build/Products/Release-iphoneos/PhamQuangIOS.app"
          PAYLOAD_DIR="$SIGN_DIR/Payload"
          APP_DST="$PAYLOAD_DIR/PhamQuangIOS.app"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_SRC" "$APP_DST"

          if [ -d "$APP_DST/PlugIns" ]; then
            rm -rf "$APP_DST/PlugIns"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_DST/Info.plist"
          cp "$SIGN_DIR/cert.mobileprovision" "$APP_DST/embedded.mobileprovision"

          if [ -d "$APP_DST/Frameworks" ]; then
            find "$APP_DST/Frameworks" -maxdepth 2 \( -name "*.dylib" -o -name "*.framework" \) -exec \
              /usr/bin/codesign --force --sign "$IDENTITY_HASH" --timestamp=none {} \;
          fi

          /usr/bin/codesign --force --sign "$IDENTITY_HASH" \
            --entitlements "$SIGN_DIR/entitlements.plist" \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP_DST"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_DST"
          /usr/bin/codesign -d --entitlements :- "$APP_DST"

          (
            cd "$SIGN_DIR"
            /usr/bin/zip -qr "$OUT_DIR/PhamQuangIOS-signed.ipa" Payload
          )
          (
            cd "$OUT_DIR"
            shasum -a 256 PhamQuangIOS-signed.ipa > PhamQuangIOS-signed.ipa.sha256
          )
          ls -lh "$OUT_DIR"

      - name: Cleanup temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/build-ipa.keychain-db" 2>/dev/null || true

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhamQuangIOS-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa-output/*
          if-no-files-found: error

      - name: Publish GitHub Release with built IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.4.1-b${{ github.run_number }}"
          gh release create "$TAG" "$OUT_DIR"/* \
            --title "PhamQuangIOS 1.4.1 (Build ${{ github.run_number }})" \
            --notes "Built from \`PhamQuang-IOS-source.zip\` on macOS/Xcode 26. Includes signed IPA (\`PhamQuangIOS-signed.ipa\`) and unsigned IPA (\`PhamQuangIOS-unsigned.ipa\`)."
