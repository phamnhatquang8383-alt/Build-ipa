name: Build and Package iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create iOS App Bundle Structure
        run: |
          echo "==> Initializing iOS Bundle Structure..."
          mkdir -p Payload/GoogleAIConsole.app

          # Copy index.html or assets into app bundle
          if [ -f "index.html" ]; then
            cp index.html Payload/GoogleAIConsole.app/
          fi

          # Create compliant Apple iOS Info.plist
          cat << 'EOF' > Payload/GoogleAIConsole.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Google AI Console</string>
            <key>CFBundleExecutable</key>
            <string>GoogleAIConsole</string>
            <key>CFBundleIdentifier</key>
            <string>com.phamnhatquang.googleaiconsole</string>
            <key>CFBundleName</key>
            <string>GoogleAIConsole</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
          </dict>
          </plist>
          EOF

          # Create executable launcher
          echo '#!/bin/sh' > Payload/GoogleAIConsole.app/GoogleAIConsole
          echo 'echo "Google AI Console starting..."' >> Payload/GoogleAIConsole.app/GoogleAIConsole
          chmod +x Payload/GoogleAIConsole.app/GoogleAIConsole

      - name: Build IPA Archive
        run: |
          echo "==> Zipping iOS IPA Archive..."
          zip -qry GoogleAIConsole.ipa Payload
          ls -lh GoogleAIConsole.ipa

      - name: Validate IPA Structure
        run: |
          echo "==> Validating IPA content..."
          unzip -l GoogleAIConsole.ipa | grep -E "Info.plist|GoogleAIConsole"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAIConsole-IPA
          path: GoogleAIConsole.ipa
          retention-days: 30
