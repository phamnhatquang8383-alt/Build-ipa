name: Build iOS IPA (SimpleTunnel)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write
  actions: read

jobs:
  build-ipa:
    name: Build & Package SimpleTunnel IPA
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Build Environment
        run: |
          echo "=== System Information ==="
          sw_vers
          xcodebuild -version
          swift --version

      - name: 3. Unpack Project Archive
        run: |
          echo "=== Locating Project Files ==="
          if [ -f "SimpleTunnel-master.zip" ]; then
            echo "Unzipping SimpleTunnel-master.zip..."
            unzip -q -o SimpleTunnel-master.zip
          fi
          
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "❌ Error: Could not find .xcodeproj file!"
            ls -la
            exit 1
          fi
          
          echo "✅ Found project at: $PROJ_PATH"
          echo "PROJ_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV
          echo "PROJ_FILE=$(basename "$PROJ_PATH")" >> $GITHUB_ENV

      - name: 4. Inspect Xcode Targets
        run: |
          cd "$PROJ_DIR"
          echo "=== Xcode Project Targets & Configs ==="
          xcodebuild -list -project "$PROJ_FILE"

      - name: 5. Compile iOS Target (SimpleTunnel)
        run: |
          cd "$PROJ_DIR"
          
          echo "=== Building SimpleTunnel iOS App without code signing ==="
          xcodebuild build \
            -project "$PROJ_FILE" \
            -target SimpleTunnel \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES
          
          echo "=== Build Completed ==="
          find build -name "*.app" -type d

      - name: 6. Package App into IPA (Payload format)
        run: |
          cd "$PROJ_DIR"
          PAYLOAD_DIR="$(pwd)/Payload"
          EXPORT_DIR="$(pwd)/ipa_export"
          mkdir -p "$PAYLOAD_DIR" "$EXPORT_DIR"
          
          # Locate .app bundle
          APP_PATH=$(find build -name "SimpleTunnel.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: No .app bundle found in build folder!"
            find build -maxdepth 4
            exit 1
          fi
          
          echo "Found compiled app bundle at: $APP_PATH"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          
          # Compress to IPA
          zip -q -r -y "$EXPORT_DIR/SimpleTunnel.ipa" Payload
          
          echo "=== IPA Generated Successfully ==="
          ls -lh "$EXPORT_DIR/SimpleTunnel.ipa"
          echo "EXPORT_IPA_PATH=$EXPORT_DIR/SimpleTunnel.ipa" >> $GITHUB_ENV

      - name: 7. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTunnel-iOS-IPA
          path: ${{ env.PROJ_DIR }}/ipa_export/SimpleTunnel.ipa
          retention-days: 30
          if-no-files-found: error
