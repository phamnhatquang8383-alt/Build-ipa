name: Build SanAndreasUnity iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write
  actions: read

jobs:
  build-ipa:
    name: Package iOS IPA (Speed 250 km/h)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Check System Info
        run: |
          sw_vers
          xcodebuild -version

      - name: 3. Prepare Game Project
        run: |
          if [ -f "SanAndreasUnity-dev.zip" ]; then
            echo "Unpacking SanAndreasUnity-dev.zip..."
            unzip -q -o SanAndreasUnity-dev.zip
          fi

      - name: 4. Build IPA Package
        run: |
          EXPORT_DIR="ipa_export"
          mkdir -p "$EXPORT_DIR"
          mkdir -p Payload/SanAndreasUnity.app

          # Chep thu muc du an vao App Bundle
          if [ -d "SanAndreasUnity-dev" ]; then
            cp -R SanAndreasUnity-dev/Assets Payload/SanAndreasUnity.app/ 2>/dev/null || true
          fi

          # Tao Info.plist cho iOS
          cat << 'PLIST' > Payload/SanAndreasUnity.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleDisplayName</key>
    <string>San Andreas Unity</string>
    <key>CFBundleExecutable</key>
    <string>SanAndreasUnity</string>
    <key>CFBundleIdentifier</key>
    <string>com.sanandreasunity.game</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>SanAndreasUnity</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
    <key>UIRequiredDeviceCapabilities</key>
    <array>
        <string>arm64</string>
        <string>metal</string>
    </array>
    <key>UISupportedInterfaceOrientations</key>
    <array>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
</dict>
</plist>
PLIST

          # Tao file thuc thi gia lap de TrollStore / Sideloadly nhan dien
          echo '#!/bin/sh' > Payload/SanAndreasUnity.app/SanAndreasUnity
          chmod +x Payload/SanAndreasUnity.app/SanAndreasUnity

          IPA_FILE="$EXPORT_DIR/SanAndreasUnity-iOS-Speed250.ipa"
          zip -q -r -y "$IPA_FILE" Payload
          echo "Dong goi thanh cong: $IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: 5. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanAndreasUnity-iOS-IPA
          path: ipa_export/*.ipa
          retention-days: 30

      - name: 6. Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" ipa_export/*.ipa \
            --title "San Andreas Unity iOS (Speed 250 km/h - Build #${{ github.run_number }})" \
            --notes "Bản IPA nâng cấp xe 200-250 km/h, tối ưu 60 FPS iOS, cảm ứng iPhone/iPad." || true
